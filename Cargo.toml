[package]
name = "bryanmaina-portfolio"
version = "0.1.0"
edition = "2021"

[dependencies]
console_error_panic_hook = "0.1.7"
console_log = "1"
log = "0.4"
leptos = { version = "0.7.0", features = ["nightly", "csr"] }
leptos_meta = "0.7.8"
leptos_router = { version = "0.7.8", features = ["nightly"] }
thaw = { version = "0.4.5", features = ["nightly", "csr"] }
gloo-net = "0.6.0"
leptos-use = { version = "0.15.7", features = ["storage"] }

[dev-dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-test = "0.3"
web-sys = { version = "0.3", features = ["Document", "Window"] }

[profile.release]
opt-level = 'z'
lto = true
codegen-units = 1
panic = "abort"
